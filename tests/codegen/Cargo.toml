[package]
name = "starpc-codegen-check"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
prost = "0.14"
starpc = { path = "../.." }

[build-dependencies]
starpc = { path = "../..", features = ["build"] }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
