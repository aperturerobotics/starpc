[project]
name = "starpc"
version = "0.52.0"
requires-python = ">=3.14,<3.15"
dependencies = ["protobuf==7.36.1"]
readme = "python/README.md"
license = "MIT"
license-files = ["LICENSE"]

[tool.uv.workspace]
members = ["python/plugin"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.6",
    "types-protobuf==7.35.1.20260827",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["starpc*", "srpc*", "rpcstream*"]
exclude = ["python*", "echo*", "mock*", "integration*", "e2e*"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["srpc.rpcproto_pb2", "rpcstream.rpcstream_pb2"]
disable_error_code = ["type-arg"]
